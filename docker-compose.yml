services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: envpilot
      POSTGRES_USER: envpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envpilot"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://envpilot:${POSTGRES_PASSWORD}@db:5432/envpilot
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m envpilot.init_db && uvicorn envpilot.api:app --host 0.0.0.0 --port 8000"
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://envpilot:${POSTGRES_PASSWORD}@db:5432/envpilot
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m envpilot.init_db && python -m envpilot.worker"
volumes:
  postgres_data:
